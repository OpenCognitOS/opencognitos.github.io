# Download- und Sterne-Zähler der Website aktuell halten: schreibt stats.json, die die Seite
# von der eigenen Domain nachlädt (Besucher fragen so nie selbst GitHub an).
# Committet nur, wenn sich eine Zahl geändert hat.
name: Website-Zahlen aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zahlen abfragen
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-stats.sh > stats.json && cat stats.json
      - name: Committen, falls geändert
        run: |
          git add stats.json
          if git diff --cached --quiet; then echo "unverändert"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Website-Zahlen aktualisiert"
          git push
